<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Geckard — tableros kanban ágiles" />
    <title>Geckard</title>
    <!-- Favicon: solo el icono G+gecko (public/geckard-logo.png). PNG es estándar; .ico opcional para casos legacy. -->
    <link rel="icon" type="image/png" href="/geckard-logo.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/geckard-logo.png" />
    <!-- Tema oscuro/claro según sistema, antes del bundle (evita flash) -->
    <script>
      (function () {
        try {
          var m = window.matchMedia("(prefers-color-scheme: dark)");
          function sync() {
            document.documentElement.classList.toggle("dark", m.matches);
          }
          sync();
          m.addEventListener("change", sync);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
