<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Geckard — Tableros Kanban Ágiles" />
    <title>Geckard</title>
    <link rel="icon" type="image/x-icon" href="/geckard-logo.ico" />
    <link rel="icon" type="image/png" href="/geckard-logo.png" />
    <script>
      (function () {
        try {
          var m = window.matchMedia("(prefers-color-scheme: dark)");
          function sync() {
            document.documentElement.classList.toggle("dark", m.matches);
          }
          sync();
          m.addEventListener("change", sync);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
