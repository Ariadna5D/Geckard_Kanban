services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_kanban
    ports:
      - "27017:27017"
    environment: 
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - kanban_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile 
    container_name: backend_kanban
    command: npm run start:dev  
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app         
      - /usr/src/app/node_modules      
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # Misma fuente que en producción (JWT + Mongo + Cloudinary)
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DATABASE=${MONGO_DATABASE:-kanban_db}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - kanban_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_kanban
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3000
    volumes:
      - ./frontend:/app                
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - kanban_network

networks:
  kanban_network:
    driver: bridge

volumes:
  mongo_data: