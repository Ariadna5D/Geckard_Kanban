name: Despliegue Automático MERN
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: 1. Descargar código de GitHub
        uses: actions/checkout@v4

      - name: 2. Preparar Backend (Nest.js)
        run: |
          cd TFG_Kanban/backend
          npm install
          npm run build

      - name: 3. Preparar Frontend (React + Vite)
        run: |
          cd TFG_Kanban/frontend
          npm install
          npm run build

      - name: 4. Reiniciar servicios con PM2
        run: |
          pm2 delete TFG_Kanban/backend || true
          pm2 start TFG_Kanban/backend/dist/main.js --name "backend"
          
          # Guardamos la configuración para que sobreviva a reinicios de la RPi
          pm2 save