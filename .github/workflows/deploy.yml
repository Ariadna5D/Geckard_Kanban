name: Despliegue con Docker TFG
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Levantar Docker
        run: |
          cd ${{ github.workspace }}
          
          docker compose down
          docker compose up -d --build