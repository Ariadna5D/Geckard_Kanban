name: Despliegue con Docker TFG
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      # Secrets en: Repo → Settings → Secrets and variables → Actions
      # Obligatorios: MONGO_USERNAME, MONGO_PASSWORD, JWT_SECRET
      # Obligatorios también: CORS_ORIGINS (dominios permitidos en producción)
      # Opcionales: MONGO_DATABASE (si no, el backend usa kanban_db), CLOUDINARY_*
      - name: 2. Generar .env desde secretos
        run: |
          cd ${{ github.workspace }}
          {
            echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}"
            echo "MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}"
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}"
            echo "MONGO_DATABASE=${{ secrets.MONGO_DATABASE }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
          } > .env

      - name: 3. Levantar Docker
        run: |
          cd ${{ github.workspace }}

          docker compose down
          docker compose up -d --build