name: Despliegue Automático en Raspberry
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Descargar código de GitHub
        uses: actions/checkout@v4

      - name: Instalar dependencias y Construir (Build)
        run: |
          npm install
          npm run build --if-present
          
      - name: Reiniciar la aplicación con PM2
        run: |
          pm2 restart all || pm2 start dist/main.js --name "mi-web"