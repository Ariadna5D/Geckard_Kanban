services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_kanban
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - kanban_network
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend_kanban
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - kanban_network

  frontend:
    build: ./frontend
    container_name: frontend_kanban
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - kanban_network

networks:
  kanban_network:
    driver: bridge

volumes:
  mongo_data: