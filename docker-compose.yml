# Variables obligatorias (raíz del proyecto: copia .envExample → .env):
# MONGO_USERNAME, MONGO_PASSWORD, JWT_SECRET
# Opcional: MONGO_DATABASE (por defecto kanban_db), CLOUDINARY_*
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_kanban
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - kanban_network
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend_kanban
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE:-kanban_db}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongodb
    networks:
      - kanban_network

  frontend:
    build: ./frontend
    container_name: frontend_kanban
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - kanban_network

networks:
  kanban_network:
    driver: bridge

volumes:
  mongo_data: